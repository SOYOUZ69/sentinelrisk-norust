<div class="assets-container">
  <div class="header">
    <h2>Assets SNMP</h2>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="toggleDemoMode()">
        {{ snmpService.isDemoMode ? 'Mode Réel' : 'Mode Démo' }}
      </button>
      <button mat-raised-button color="accent" (click)="syncAllAssets()" 
              [disabled]="assets.filter(a => !a.synchronizedWithZabbix).length === 0">
        <mat-icon>sync</mat-icon>
        Synchroniser Tout
      </button>
    </div>
  </div>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <table mat-table [dataSource]="assets" class="mat-elevation-z8">
    <!-- Host Column -->
    <ng-container matColumnDef="host">
      <th mat-header-cell *matHeaderCellDef>Host</th>
      <td mat-cell *matCellDef="let asset">{{asset.host}}</td>
    </ng-container>

    <!-- IP Column -->
    <ng-container matColumnDef="ip">
      <th mat-header-cell *matHeaderCellDef>IP</th>
      <td mat-cell *matCellDef="let asset">{{asset.ip}}</td>
    </ng-container>

    <!-- Version Column -->
    <ng-container matColumnDef="version">
      <th mat-header-cell *matHeaderCellDef>Version</th>
      <td mat-cell *matCellDef="let asset">{{asset.version}}</td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let asset">
        <mat-chip-list>
          <mat-chip [color]="asset.status === 'active' ? 'primary' : 'warn'" selected>
            {{asset.status}}
          </mat-chip>
        </mat-chip-list>
      </td>
    </ng-container>

    <!-- Sync Column -->
    <ng-container matColumnDef="sync">
      <th mat-header-cell *matHeaderCellDef>Synchronisation</th>
      <td mat-cell *matCellDef="let asset">
        <div class="sync-status">
          <mat-icon [color]="getSyncStatusColor(asset)" 
                   [class.spinning]="asset.syncInProgress"
                   [matTooltip]="getSyncStatusText(asset)">
            {{getSyncStatusIcon(asset)}}
          </mat-icon>
          <span class="sync-text" [ngClass]="getSyncStatusColor(asset) + '-text'">
            {{getSyncStatusText(asset)}}
          </span>
        </div>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let asset">
        <!-- Bouton de synchronisation (visible seulement si non synchronisé) -->
        <button mat-icon-button color="accent" 
                (click)="syncAsset(asset)" 
                [disabled]="asset.syncInProgress || asset.synchronizedWithZabbix"
                *ngIf="!asset.synchronizedWithZabbix"
                matTooltip="Synchroniser avec Zabbix">
          <mat-icon>sync</mat-icon>
        </button>
        
        <!-- Actions existantes -->
        <button mat-icon-button color="primary" (click)="pauseAsset(asset)" matTooltip="Pause">
          <mat-icon>pause</mat-icon>
        </button>
        <button mat-icon-button color="accent" (click)="editAsset(asset)" matTooltip="Éditer">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteAsset(asset)" matTooltip="Supprimer">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="!loading && assets.length === 0" class="no-data">
    <p>Aucun asset SNMP trouvé</p>
  </div>
</div>
