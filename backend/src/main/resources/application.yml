server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: sentinel
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/sentinelrisk
          jwk-set-uri: http://localhost:8081/realms/sentinelrisk/protocol/openid-connect/certs

logging:
  level:
    root: INFO
    com.sentinelrisk: DEBUG
    org.springframework.security: DEBUG
    org.springdoc: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
    org.keycloak: DEBUG

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:sentinelrisk}
  resource: ${KEYCLOAK_CLIENT_ID:sentinelrisk-backend}
  public-client: false
  bearer-only: true

# Springdoc OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operationsSorter: method
    tagsSorter: alpha
    filter: true
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs

# Configuration SNMP
snmp:
  scheduler:
    enabled: true
    interval: 300000  # 5 minutes en millisecondes
  cleanup:
    cron: "0 0 2 * * ?"  # Tous les jours à 2h du matin
    retention-days: 30   # Conserver les résultats pendant 30 jours
  # Configuration de l'automatisation Zabbix
  zabbix:
    sync-interval: "0 0/5 * * * *"  # Synchronisation toutes les 5 minutes
    cleanup-cron: "0 0 2 * * *"     # Nettoyage quotidien à 2h du matin
    enabled: true                   # Activer/désactiver l'automatisation

# Configuration Zabbix - Intégration réelle
zabbix:
  url: ${ZABBIX_URL:http://localhost:8082}  # URL de l'interface web Zabbix avec API
  username: ${ZABBIX_USERNAME:Admin}
  password: ${ZABBIX_PASSWORD:zabbix}
  timeout: 30000  # Timeout en millisecondes
  retry-attempts: 3  # Nombre de tentatives en cas d'échec 